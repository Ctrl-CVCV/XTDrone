# Phase 5: AMCL localization for car3 (ground-truth /odom, mecanum chassis)
# loaded into the amcl node's private namespace
use_map_topic: false

odom_model_type: omni
odom_alpha1: 0.05
odom_alpha2: 0.05
odom_alpha3: 0.05
odom_alpha4: 0.05
odom_alpha5: 0.05

odom_frame_id: car1/odom
base_frame_id: car1/base_footprint
global_frame_id: car1/map

laser_model_type: likelihood_field
laser_min_range: 0.1
laser_max_range: 20.0
laser_max_beams: 120
laser_z_hit: 0.95
laser_z_short: 0.05
laser_z_max: 0.05
laser_z_rand: 0.05
laser_sigma_hit: 0.2
laser_lambda_short: 0.1
laser_likelihood_max_dist: 2.0

min_particles: 200
max_particles: 1000
kld_err: 0.05
kld_z: 0.99
update_min_d: 0.05
update_min_a: 0.1
resample_interval: 1
transform_tolerance: 0.5
recovery_alpha_slow: 0.0
recovery_alpha_fast: 0.0

gui_publish_rate: 10.0
save_pose_rate: 0.5
